name: Supabase local isolated validation

# Execução MANUAL apenas (workflow_dispatch).
# Não há disparo em push nem em pull_request: o baseline schema-only ainda não
# existe em supabase/baseline/. Activar disparos automáticos só depois de o
# baseline ser aprovado (ver supabase/baseline/VALIDACAO.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-stack:
    name: Local Supabase baseline, migrations, Auth, RLS and Storage invariants
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Validate local configuration
        run: |
          supabase --version
          supabase config validate

      # Falha explicitamente se o baseline não existir ou se houver decisões pendentes.
      # Não usa credenciais, não faz supabase link e não acede a produção.
      - name: Prepare disposable migration workdir
        run: bash .github/scripts/prepare-supabase-local.sh

      - name: Start disposable local Supabase stack
        working-directory: ${{ runner.temp }}/negomapa-supabase-local
        run: supabase start

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate Auth endpoint and database invariants
        working-directory: ${{ runner.temp }}/negomapa-supabase-local
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(supabase status -o env)"
          API_URL="$(echo "$STATUS" | sed -n 's/^API_URL=//p' | tr -d '"')"
          ANON_KEY="$(echo "$STATUS" | sed -n 's/^ANON_KEY=//p' | tr -d '"')"
          DB_URL="$(echo "$STATUS" | sed -n 's/^DB_URL=//p' | tr -d '"')"

          test -n "$API_URL"
          test -n "$ANON_KEY"
          test -n "$DB_URL"

          curl --fail --silent --show-error \
            --header "apikey: $ANON_KEY" \
            "$API_URL/auth/v1/settings" >/dev/null

          psql "$DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/tests/fase8_local_invariants.sql

      - name: Stop local stack
        if: always()
        working-directory: ${{ runner.temp }}/negomapa-supabase-local
        run: supabase stop
