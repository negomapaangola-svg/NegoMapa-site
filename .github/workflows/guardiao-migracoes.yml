name: Guardião de migrações

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guardiao:
    name: Guardião de migrações (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Registo, comandos proibidos, runner e modo só baseline
        run: python3 -I .github/scripts/guardiao_migracoes.py
