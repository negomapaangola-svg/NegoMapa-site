name: Validate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, build and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint files changed in this pull request
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_BASE_SHA:-}" && -n "${PR_HEAD_SHA:-}" ]]; then
            HEAD_SHA="$PR_HEAD_SHA"
            BASE_SHA="$(git merge-base "$PR_BASE_SHA" "$HEAD_SHA")"
          else
            HEAD_SHA="$GITHUB_SHA"
            git fetch origin main
            BASE_SHA="$(git merge-base origin/main "$HEAD_SHA")"
          fi

          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )

          if (("${#FILES[@]}" == 0)); then
            echo "No changed JavaScript/TypeScript files to lint."
          else
            printf 'ESLint will analyse these changed files:\n'
            printf ' - %s\n' "${FILES[@]}"
            npx eslint -- "${FILES[@]}"
          fi

      - name: Build
        run: npm run build

      - name: TypeScript
        run: npx tsc --noEmit
